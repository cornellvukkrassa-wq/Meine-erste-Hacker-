name: Build TV launcher

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build release APK
        run: gradle -p launcher assembleRelease --no-daemon
      - name: Rename APK
        run: cp launcher/app/build/outputs/apk/release/app-release.apk tvhome.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: tvhome.apk
      - name: Publish as the "launcher-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-latest
          name: Minimal TV Home (latest build)
          prerelease: true
          files: tvhome.apk
          body: Built from ${{ github.sha }}. Install with `python3 tvtool/tv.py install-launcher tvhome.apk`.
